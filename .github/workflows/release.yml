name: Release

# Publishing is npm Trusted Publishing: the job exchanges its OIDC token for a
# short-lived credential, so there is no long-lived NPM_TOKEN in this
# repository's secrets and nothing to leak or rotate.
#
# npm's documented limitation says that for a workflow using workflow_call or
# workflow_dispatch, "validation checks the calling workflow's name instead of
# the workflow that actually contains the publish command". A dispatch of this
# file presents this file as its own workflow_ref, so it ought to match, and
# run 35699600341 measured that it does: 0.3.0 published from a dispatch and
# npm signed its provenance. The tag trigger stays anyway, for a tag pushed by
# hand. The publish step is never reached through workflow_call.
#
# The tag and the GitHub release are made by this job rather than pushed ahead
# of it, so cutting a release is one action and a tag can never name a commit
# the publish did not come from.

on:
  workflow_dispatch:
    inputs:
      # Unchecked publishes. The tag trigger below publishes with no box to
      # tick at all, so a dispatch that needed one to do the same thing was the
      # odd one out. Tick it to pack and validate without publishing.
      dry_run:
        description: Pack and validate without publishing
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents is write only because the last step creates the tag and the
      # GitHub release. Nothing else here writes to the repository, and no step
      # pushes to a branch. id-token is what trusted publishing needs, and what
      # makes npm sign a provenance attestation naming the commit and this
      # workflow.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later and node 22.14.0 or later.
      # Node 22 ships npm 10, so the upgrade is explicit rather than whatever
      # the runner image happens to carry this month.
      - run: npm install -g npm@latest
      - run: node --version && npm --version

      - run: bun install --frozen-lockfile

      # The same gate ci.yml runs. This workflow used to run less than CI did,
      # which is backwards for the one job whose mistakes cannot be undone: a
      # version cannot be unpublished after 72 hours. `test:coverage` runs the
      # same files as `test` and adds the floor, so the bare `test` is not
      # repeated here.
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: simulation purity scan
        run: bun run scripts/lint-sim-purity.ts
      - name: packages would install cleanly
        run: bun run scripts/check-publishable.ts

      # Two steps rather than one with a conditional argument: a ternary inside
      # a shell string is where this kind of workflow goes wrong quietly.
      #
      # A dry run packs each package and asks the registry to validate the
      # manifest. It does not exercise the OIDC exchange, because --dry-run
      # never reaches the publish endpoint. The credential is proven only by a
      # real publish, and the provenance attestation is the evidence.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: bun run scripts/publish.ts --dry-run
      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: bun run scripts/publish.ts

      # `gh release create` creates the tag at --target when it does not exist
      # yet, so this is the tag and the release in one call. A ref created with
      # GITHUB_TOKEN does not start another workflow run, which is what stops
      # this retriggering the push: tags trigger above.
      #
      # It runs even when the publish above found the version already on the
      # registry, because that is exactly the re-run that exists to add a tag
      # or a release that went missing. Both halves check first, so running it
      # again changes nothing.
      - name: Tag and publish the GitHub release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/engine/package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          bun run scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
