name: Cross-engine matrix

# Engine determinism is an OS and architecture question as well as a JS engine
# one: Apple Silicon JavaScriptCore and Windows V8 are different builds. The
# kernel is pure JavaScript so it should be immune. This job is what turns
# "should be" into "is". Too slow for every pull request, so it runs nightly.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not windows-latest. On the windows-latest image
        # (windows-2025-vs2026) every chromium launch measured here times out
        # after the full 180000ms: runs 35585146006, 35623981277 and
        # 35666263552 all assign the browser a pid and never finish the
        # --remote-debugging-pipe handshake. It happens to the headless shell
        # and to the full chrome.exe alike, so the browser build is not the
        # variable. This leg has never passed on windows-latest, and ci.yml is
        # Linux-only, so no Windows browser launch in this repository has ever
        # worked. Pinning the image is the next variable to move.
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: bun run scripts/engines.ts --require-all --heavy

  fuzz:
    name: seeded fuzz replay
    runs-on: ubuntu-latest
    env:
      PW_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: bun run test:e2e:nightly
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
