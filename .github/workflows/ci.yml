name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  check:
    name: lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: coverage floor
        run: bun run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
      - name: simulation purity scan
        run: bun run scripts/lint-sim-purity.ts
      - name: packages would install cleanly
        run: bun run scripts/check-publishable.ts

  arm64:
    name: arm64
    # The architecture half the players are on, and nothing else in CI runs
    # there. Two dmath tests failed on an Apple Silicon Mac while every x86
    # job was green: the golden vectors pinned a NaN's sign, which the
    # hardware decides, and the tan oracle bound was calibrated against
    # glibc rather than Apple's libm. Both reached a laptop because CI could
    # not see them.
    #
    # Build and test only. Lint and typecheck do not vary by architecture,
    # and the cross-engine sweep compares a digest against a file recorded on
    # x86, which is a separate question from whether the suite passes here.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-arm64-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  engines:
    name: cross-engine determinism
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bun run scripts/playwright-version.ts)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: bun run scripts/engines.ts --require-all --heavy
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-divergence
          path: test-results/engines/

  e2e:
    name: replay e2e
    needs: check
    runs-on: ubuntu-latest
    env:
      PW_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bun run scripts/playwright-version.ts)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: bun run demo:build
      # A production build must not carry the test hooks. It is checked here
      # rather than after the e2e build, which sets the flag on purpose.
      - run: bun run scripts/check-no-test-hooks.ts
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
