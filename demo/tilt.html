<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clockwork 2 - tilt check</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0b14; --panel: #14151f; --line: #3a3c4e; --muted: #8b8fa3; --fg: #e8e9ee; --accent: #4a6cf7; --pass: #3fbf7f; --fail: #f06a5b; --dot: #f7c84a; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 ui-sans-serif, system-ui, sans-serif; }
      main { padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); max-width: 560px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      #progress { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
      #instruction { font-size: 20px; font-weight: 600; margin: 0 0 12px; min-height: 3em; }
      #status { color: var(--muted); font-size: 15px; margin: 0 0 12px; min-height: 1.5em; }
      .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
      button { font: inherit; font-size: 18px; padding: 14px 20px; flex: 1 1 auto; border-radius: 10px; border: 0; background: var(--accent); color: white; }
      button.quiet { background: transparent; color: var(--fg); border: 1px solid var(--line); }
      #field { position: relative; height: 200px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
      #dot { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: var(--dot); left: 50%; top: 50%; }
      #live { font-family: ui-monospace, monospace; font-size: 14px; color: var(--muted); margin: 0 0 12px; }
      #summary { list-style: none; padding: 0; margin: 0 0 12px; }
      #summary li { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .passed { color: var(--pass); }
      .failed { color: var(--fail); }
      .skipped { color: var(--muted); }
      #results { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 0 0 12px; }
      #scroll { height: 2400px; border-top: 1px dashed var(--line); padding-top: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Tilt check</h1>
      <p id="progress">About two minutes. Follow each instruction; the page moves on by itself.</p>
      <p id="instruction">Tap Allow tilt. On an iPhone or iPad a prompt asks first: tap Allow.</p>
      <p id="status"></p>
      <div class="buttons">
        <button id="allow" type="button">Allow tilt</button>
        <button id="retry" type="button" hidden>Ask again</button>
        <button id="skip" type="button" class="quiet" hidden>Skip</button>
        <button id="copy" type="button" hidden>Copy results</button>
      </div>
      <div id="field"><div id="dot"></div></div>
      <p id="live">x 0, y 0, z 0</p>
      <ul id="summary" hidden></ul>
      <pre id="results" hidden></pre>
      <div id="scroll" hidden>Keep scrolling up and down, and keep tilting the phone as you go.</div>
    </main>
    <script type="module" src="/src/tilt/page.ts"></script>
  </body>
</html>
